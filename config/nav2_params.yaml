controller_server:
  ros__parameters:
    # Must equal 1/model_dt so Humble MPPI enables control-sequence shifting
    # (publishes the next timestep — ~50 ms of plant delay compensation).
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.5
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 1.0
    progress_checker_plugin: "progress_checker"
    goal_checker_plugins: ["general_goal_checker"]
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.20
      movement_time_allowance: 12.0
    general_goal_checker:
      stateful: True
      plugin: "nav2_controller::SimpleGoalChecker"
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.25

    FollowPath:
      plugin: "nav2_mppi_controller::MPPIController"

      # Horizon: 56 * 0.05 = 2.8 s → 1.4 m at 0.5 m/s (fits 2.0 m local radius).
      # Longer horizon lets MPPI plan a gentle S instead of a snap-to-path turn.
      time_steps: 56
      model_dt: 0.05
      batch_size: 1000
      iteration_count: 1
      prune_distance: 1.7
      transform_tolerance: 0.1
      temperature: 0.35         # 0.5 averaged colliding samples into near-zero cmd_vel
      gamma: 0.015
      retry_attempt_limit: 2
      visualize: false          # viz at 1000 batches drops cycles and jerks cmd_vel
      regenerate_noises: false

      motion_model: "DiffDrive"

      # Match velocity_smoother. Humble MPPI has no ax/az limits.
      # No reverse — BackUp recovery handles unsticking.
      vx_max: 0.55
      vx_min: 0.0
      wz_max: 0.85
      ax_max: 0.8               # ignored by Humble MPPI; kept in sync with smoother
      ax_min: 0.0 #-1.0
      az_max: 1.0 #0.90

      # 0.8 weaved; 0.18 could not sample the heading change in a corridor.
      vx_std: 0.22
      vy_std: 0.0
      wz_std: 0.30

      TrajectoryVisualizer:
        trajectory_step: 5
        time_step: 3

      critics: ["ConstraintCritic", "CostCritic", "GoalCritic", "GoalAngleCritic",
                "PathAlignCritic", "PathFollowCritic", "PathAngleCritic",
                "PreferForwardCritic", "ObstaclesCritic", "TwirlingCritic"]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0

      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.2        # < 3.81 so it will enter inflation instead of freezing
        critical_cost: 250.0    # 280 made sitting in red inflation cheaper than moving
        consider_footprint: true
        collision_cost: 1000000.0
        near_goal_distance: 0.40
        trajectory_point_step: 2

      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0       # must beat CostCritic while already in inflation
        offset_from_furthest: 6
        threshold_to_consider: 1.4  # ≈ prediction distance; hand-off to GoalCritic

      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0 #12.0       # 18 snapped; 10 with offset 20 never engaged at start
        max_path_occupancy_ratio: 0.07
        trajectory_point_step: 4
        threshold_to_consider: 0.50
        offset_from_furthest: 14
        use_path_orientations: true  # Smac Lattice paths carry yaw; follow heading

      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.5        # only active when heading error > max_angle_to_furthest
        offset_from_furthest: 4
        threshold_to_consider: 0.50
        max_angle_to_furthest: 0.85  # only fight large misalignment, not every 30°
        forward_preference: true

      PreferForwardCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 0.50

      ObstaclesCritic:
        enabled: false          # CostCritic already scores footprint; both freeze in inflation
        cost_power: 1
        consider_footprint: true
        repulsion_weight: 0.3
        critical_weight: 10.0
        collision_cost: 100000.0
        collision_margin_distance: 0.02
        near_goal_distance: 0.40

      TwirlingCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0        # 10 forbade the heading change this pose needs

      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4

      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.50

local_costmap:
  local_costmap:
    ros__parameters:
      update_frequency: 15.0 #20.0 #15.0 #5.0
      publish_frequency: 5.0 #5.0 #2.0
      global_frame: odom
      robot_base_frame: base_link
      use_sime_time: False
      rolling_window: true
      width: 4 #3
      height: 4 #3
      resolution: 0.05
      # footprint: "[[0.25, 0.25], [0.25, -0.25], [-0.35, -0.25], [-0.36, 0.25]]"
      footprint: "[[0.26, 0.20], [0.26, -0.20], [-0.36, -0.20], [-0.36, 0.20]]"
      # robot_radius: 0.40
      footprint_padding: 0.02
      plugins: ["static_layer","obstacle_layer","obstacle_layer2" ,"stvl_layer", "inflation_layer"]
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 1.5 #1.1 #4.0
        inflation_radius: 0.65 #0.32
      voxel_layer:
        plugin: "nav2_costmap_2d::VoxelLayer"
        enabled: True
        footprint_clearing_enabled: true
        publish_voxel_map: True
        origin_z: 0.0
        z_resolution: 0.05
        z_voxels: 16
        max_obstacle_height: 0.5
        mark_threshold: 0
        observation_sources: camera
        combination_method: 1 
        camera:
          topic: /camera/depth/points
          max_obstacle_height: 0.5 #1.0
          min_obstacle_height: 0.0
          data_type: "PointCloud2"
          raytrace_max_range: 3.0
          raytrace_min_range: 0.4
          obstacle_max_range: 2.5
          obstacle_min_range: 0.4
          clearing: True
          marking: True
          data_type: "PointCloud2"
          transport_type: "raw"
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        observation_sources: scan
        footprint_clearing_enabled: true
        combination_method: 1
        scan:
          topic: /scan
          max_obstacle_height: 2.0
          clearing: True
          marking: True
          data_type: "LaserScan"
          raytrace_max_range: 3.0 #3.0
          raytrace_min_range: 0.0
          obstacle_max_range: 2.5 #2.5
          obstacle_min_range: 0.0
          marking: True
          clearing: True
          data_type: "LaserScan"
          inf_is_valid: false
      obstacle_layer2:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: True
        combination_method: 1
        footprint_clearing_enabled: true
        observation_sources: scan_us_center scan_us_right scan_us_left
        scan_us_center:
          topic: /scan_us_center
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          raytrace_max_range: 3.0 # 3.0  # keep >= range_to_scan clear_range (2.8) so empty US cones clear locally
          raytrace_min_range: 0.00
          obstacle_max_range: 0.75 #0.70
          obstacle_min_range: 0.00
          inf_is_valid: false
        scan_us_right:
          topic: /scan_us_right
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          raytrace_max_range: 3.0 # 3.0  # keep >= range_to_scan clear_range (2.8) so empty US cones clear locally
          raytrace_min_range: 0.00
          obstacle_max_range: 0.40 #0.30
          obstacle_min_range: 0.00
          inf_is_valid: false
        scan_us_left:
          topic: /scan_us_left
          data_type: "LaserScan"
          marking: True
          clearing: True
          min_obstacle_height: 0.05
          max_obstacle_height: 0.5
          raytrace_max_range: 3.0 # 3.0  # keep >= range_to_scan clear_range (2.8) so empty US cones clear locally
          raytrace_min_range: 0.00
          obstacle_max_range: 0.40 #0.30
          obstacle_min_range: 0.00
          inf_is_valid: false
      range_layer1:
        plugin: "range_layer::RangeLayer"
        enabled: True
        use_common_params: true # Set to true to use common defaults for all topics, false for topic overrides
        common_keep_time: 1.0   # [double] Time in seconds to keep range readings in the costmap before pruning
        common_fov_padding: 0.2 # [double] Padding in radians added to the sensor's field of view
        common_min_dist: 0.03   # [double] Minimum sensor range in meters below which readings are ignored
        common_max_dist: 1.0    # [double] Maximum sensor range in meters above which readings are ignored
        topics: [
          "/range_center_filtered",
          "/range_right_filtered",
          "/range_left_filtered"
        ]

        # Used only when use_common_params is false.
        _range_center_filtered:
          keep_time: 1.0        # [double] Time in seconds to keep readings for this sensor
          fov_padding: 0.01     # [double] FOV padding in radians for this sensor
          min_dist: 0.05        # [double] Minimum sensor range in meters for this sensor
          max_dist: 5.0         # [double] Maximum sensor range in meters for this sensor
        _range_right_filtered:
          keep_time: 1.0        # [double] Time in seconds to keep readings for this sensor
          fov_padding: 0.01     # [double] FOV padding in radians for this sensor
          min_dist: 0.05        # [double] Minimum sensor range in meters for this sensor
          max_dist: 5.0         # [double] Maximum sensor range in meters for this sensor
        _range_left_filtered:
          keep_time: 1.0        # [double] Time in seconds to keep readings for this sensor
          fov_padding: 0.01     # [double] FOV padding in radians for this sensor
          min_dist: 0.05        # [double] Minimum sensor range in meters for this sensor
          max_dist: 5.0         # [double] Maximum sensor range in meters for this sensor

      range_layer2:
        plugin: "nav2_costmap_2d::RangeSensorLayer"
        enabled: True
        topics: ["/range_center_filtered", "/range_right_filtered", "/range_left_filtered"]
        transform_tolerance: 0.3
        clear_on_max_reading: true
        clear_threshold: 0.2
        mark_threshold: 0.8
        no_readings_timeout: 5.0
        clear_after_reading: true
        max_distance: 0.5
        min_distance: 0.03
        clear_on_max_reading: true
        buffer_size: 10
        observation_persistence: 2.0
        inf_is_valid: false

      denoise_layer:
        plugin: "nav2_costmap_2d::DenoiseLayer"
        enabled: true
        minimal_group_size: 2
        group_connectivity_type: 8

      stvl_layer:
        plugin: "spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer"
        enabled: true
        voxel_size: 0.05
        voxel_decay: 2.0          # seconds with no hit → gone (raise to 4–6 if it flickers)
        decay_model: 0            # 0 = linear decay
        publish_voxel_map: true
        combination_method: 1
        origin_z: 0.0
        unknown_threshold: 15
        mark_threshold: 2         # ignore 1-voxel speckle
        update_footprint_enabled: true
        observation_sources: camera
        camera:
          data_type: PointCloud2
          topic: /camera/depth/points
          marking: true
          clearing: true
          min_obstacle_height: 0.12   # was 0.0 → floor voxels that never clear
          max_obstacle_height: 0.5
          obstacle_range: 2.5
          min_z: 0.12
          max_z: 0.5
          vertical_fov_angle: 0.87    # match your camera (~50° → 0.87 rad)
          horizontal_fov_angle: 1.05  # match your camera (~60° → 1.05 rad)
          decay_acceleration: 1.0
          model_type: 0               # 0 = depth camera
          filter: "voxel"
          voxel_min_points: 2
          clear_after_reading: true
          observation_persistence: 0.0
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: True
      always_send_full_costmap: True

