bt_navigator:
  ros__parameters:
    use_sime_time: False
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /diff_drive_controller/odom
    bt_loop_duration: 10
    default_server_timeout: 20
    # Replan only when the path is ~10s old or becomes invalid, not at 1 Hz.
    # Custom tree: no 90° Spin recovery (that is the fast CCW yaw-away),
    # and backup is short so it cannot reverse into a wall.
    default_nav_to_pose_bt_xml: "/home/himanshu/amr_ws/src/amr_mapping/config/nav_to_pose.xml"
    # Multi-goal navigation needs its own tree; the single-goal tree is not used.
    default_nav_through_poses_bt_xml: "/home/himanshu/amr_ws/src/amr_mapping/config/nav_through_poses.xml"
