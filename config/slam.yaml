slam_toolbox:
  ros__parameters:

    # Solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # Frames
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan

    mode: mapping

    # TF / timing
    transform_timeout: 0.5
    tf_buffer_duration: 50.0

    # Scan handling
    scan_queue_size: 50
    throttle_scans: 1

    # Map
    resolution: 0.05
    min_laser_range: 0.15
    max_laser_range: 8.0

    # Process scans less frequently
    minimum_time_interval: 0.5

    # Trust odometry heavily
    use_scan_matching: true
    use_scan_barycenter: false

    # Larger movement thresholds
    minimum_travel_distance: 0.5 #0.30
    minimum_travel_heading: 0.5 #0.30

    # Loop closure - tightened acceptance since odom is already accurate,
    # to guard against false-positive closures (which snap/corrupt the map)
    # rather than needing aggressive correction of odom drift.
    do_loop_closing: true
    loop_search_maximum_distance: 3.0
    loop_match_minimum_chain_size: 12
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.45
    loop_match_minimum_response_fine: 0.55

    # Loop closure correlation search window (was missing entirely;
    # this is the search space actually used to find loop closure candidates)
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # Strong odom preference. NOTE: these are thresholds in meters/radians,
    # not weight multipliers - a match is only discounted once its deviation
    # from the odom-predicted pose exceeds this value. Previous values of
    # 40.0 / 20.0 were never exceeded by real motion, so the penalty was a
    # complete no-op (matcher was free to accept any offset with zero
    # discount, which is what let bad matches in feature-poor/new areas
    # drift the map). Set low so real odom trust actually takes effect.
    distance_variance_penalty: 2.0
    angle_variance_penalty: 0.8

    # Reduce scan corrections (unchanged from before)
    fine_search_angle_offset: 0.003
    coarse_search_angle_offset: 0.10
    coarse_angle_resolution: 0.02

    # Correlation search window (unchanged from before)
    correlation_search_space_dimension: 0.2
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.03

    min_pass_through: 1
    occupancy_threshold: 0.1

    debug_logging: false