controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    diff_drive_controller:
      type: diff_drive_controller/DiffDriveController


diff_drive_controller:
  ros__parameters:

    left_wheel_names:
      - left_wheel_joint

    right_wheel_names:
      - right_wheel_joint

    wheel_separation: 0.530
    wheel_radius: 0.085

    wheels_per_side: 1

    publish_rate: 50.0

    base_frame_id: base_link
    odom_frame_id: odom

    enable_odom_tf: true

    use_stamped_vel: false

    pose_covariance_diagonal:
      - 0.001
      - 0.001
      - 1000000.0
      - 1000000.0
      - 1000000.0
      - 0.01

    twist_covariance_diagonal:
      - 0.001
      - 0.001
      - 1000000.0
      - 1000000.0
      - 1000000.0
      - 0.01
